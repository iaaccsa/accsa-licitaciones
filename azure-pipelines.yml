trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: main-vars

steps:
  - script: |
      echo "$REGISTRY_PASS" | docker login "$REGISTRY_SERVER" \
        -u "$REGISTRY_USER" \
        --password-stdin
    displayName: "Login to ACR"
    env:
      REGISTRY_SERVER: $(AZURE_REGISTRY_SERVER)
      REGISTRY_USER: $(AZURE_REGISTRY_USER)
      REGISTRY_PASS: $(AZURE_REGISTRY_PASS)

  - script: |
      SERVICES="service-file-extractor service-files-converter service-chunk-and-index service-setup-qdrant service-iterative-requirement-extractor service-verify-compliance"

      # Detectar carpetas con cambios respecto al commit anterior
      CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

      # Si no hay diff (primer commit o error), construir todo
      if [ -z "$CHANGED_FILES" ]; then
        echo "No se pudo determinar los cambios. Construyendo todos los servicios..."
        CHANGED_SERVICES="$SERVICES"
      else
        CHANGED_SERVICES=""
        for SERVICE in $SERVICES; do
          # Construir si cambiaron archivos del servicio o de global/
          if echo "$CHANGED_FILES" | grep -qE "^($SERVICE/|global/)"; then
            CHANGED_SERVICES="$CHANGED_SERVICES $SERVICE"
          fi
        done
      fi

      if [ -z "$CHANGED_SERVICES" ]; then
        echo "No hay cambios en ningún servicio. Nada que construir."
        exit 0
      fi

      echo "Servicios a construir:$CHANGED_SERVICES"
      echo ""

      for SERVICE in $CHANGED_SERVICES; do
        echo "=========================================="
        echo "Construyendo $SERVICE..."
        echo "=========================================="
        cd $SERVICE
        chmod +x azure-build-and-push.sh
        ./azure-build-and-push.sh
        cd ..
        echo ""
      done

      echo "Todos los servicios modificados fueron construidos y pusheados."
    displayName: "Build & Push changed services"
