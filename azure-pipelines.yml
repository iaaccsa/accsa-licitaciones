trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: othes-vars
  - group: api-vars
  - group: supabase-vars

strategy:
  matrix:
    # service-file-extractor:
    #   SERVICE_NAME: "service-file-extractor"
    # service-files-converter-mistral:
    #   SERVICE_NAME: "service-files-converter-mistral"
    # service-requirement-extractor:
    #   SERVICE_NAME: "service-requirement-extractor"
    # service-qdrant-by-file:
    #   SERVICE_NAME: "service-qdrant-by-file"
    # service-documents-classifier:
    #   SERVICE_NAME: "service-documents-classifier"
    # service-documents-grouper:
    #   SERVICE_NAME: "service-documents-grouper"
    # service-digital-sig-extractor:
    #   SERVICE_NAME: "service-digital-sig-extractor"
    # service-tender-classifier:
    #   SERVICE_NAME: "service-tender-classifier"
    # service-compliance-matcher:
    #   SERVICE_NAME: "service-compliance-matcher"
    # service-build-proposal-index:
    #   SERVICE_NAME: "service-build-proposal-index"
    # service-compliance-summarizer:
    #   SERVICE_NAME: "service-compliance-summarizer"
    # service-file-metadata-extractor:
    #   SERVICE_NAME: "service-file-metadata-extractor"
    service-admissibility-gate:
      SERVICE_NAME: "service-admissibility-gate"
    # service-economic-offer-extractor:
    #   SERVICE_NAME: "service-economic-offer-extractor"
    service-admissibility-matcher:
      SERVICE_NAME: "service-admissibility-matcher"

steps:
  - script: |
      echo "$REGISTRY_PASS" | docker login "$REGISTRY_SERVER" \
        -u "$REGISTRY_USER" \
        --password-stdin
    displayName: "Login to ACR"
    env:
      REGISTRY_SERVER: $(AZURE_REGISTRY_SERVER)
      REGISTRY_USER: $(AZURE_REGISTRY_USER)
      REGISTRY_PASS: $(AZURE_REGISTRY_PASS)

  - script: |
      cd $(SERVICE_NAME)
      chmod +x build-and-push.sh
      ./build-and-push.sh azure
    displayName: "Build & Push $(SERVICE_NAME)"
    env:
      AZURE_REGISTRY_SERVER: $(AZURE_REGISTRY_SERVER)
      SUPABASE_URL: $(SUPABASE_URL)
      SUPABASE_SERVICE_KEY: $(SUPABASE_SERVICE_KEY)
      SUPABASE_ARTIFACTS_BASE_URL: $(SUPABASE_ARTIFACTS_BASE_URL)
      SUPABASE_FILES_BASE_URL: $(SUPABASE_FILES_BASE_URL)
      OPENAI_API_KEY: $(OPENAI_API_KEY)
      GOOGLE_API_KEY: $(GOOGLE_API_KEY)
      LLAMA_CLOUD_API_KEY: $(LLAMA_CLOUD_API_KEY)
      MISTRAL_API_KEY: $(MISTRAL_API_KEY)
      QDRANT_URL: $(QDRANT_URL)
      QDRANT_API_KEY: $(QDRANT_API_KEY)
      COHERE_API_KEY: $(COHERE_API_KEY)
      API_KEY: $(API_KEY)
      API_BASE_URL: $(API_BASE_URL)
      API_EVENTS_PATH: $(API_EVENTS_PATH)
      API_PROPOSALS_PATH: $(API_PROPOSALS_PATH)
      API_TENDERS_PATH: $(API_TENDERS_PATH)
      API_ANALYSES_PATH: $(API_ANALYSES_PATH)
      API_ORIGINAL_FILES_PATH: $(API_ORIGINAL_FILES_PATH)
      API_PROCESSED_FILES_PATH: $(API_PROCESSED_FILES_PATH)
      API_JOBS_CALLBACK: $(API_JOBS_CALLBACK)
      API_REQUIREMENTS_PATH: $(API_REQUIREMENTS_PATH)
      API_COMPLIANCE_RESULTS_PATH: $(API_COMPLIANCE_RESULTS_PATH)
      API_TENDER_CLASSIFICATIONS_PATH: $(API_TENDER_CLASSIFICATIONS_PATH)
      API_ANALYSIS_REQUIREMENTS_PATH: $(API_ANALYSIS_REQUIREMENTS_PATH)
      API_COMPLIANCE_MATRIX_PATH: $(API_COMPLIANCE_MATRIX_PATH)
      API_PROPOSAL_ECONOMIC_OFFERS_PATH: $(API_PROPOSAL_ECONOMIC_OFFERS_PATH)
