steps:
  - script: |
      echo "$REGISTRY_PASS" | docker login "$REGISTRY_SERVER" \
        -u "$REGISTRY_USER" \
        --password-stdin
    displayName: "Login to ACR"
    env:
      REGISTRY_SERVER: $(AZURE_REGISTRY_SERVER)
      REGISTRY_USER: $(AZURE_REGISTRY_USER)
      REGISTRY_PASS: $(AZURE_REGISTRY_PASS)

  - script: |
      cd $(SERVICE_NAME)
      chmod +x build-and-push.sh
      ./build-and-push.sh azure
    displayName: "Build & Push $(SERVICE_NAME)"
    env:
      AZURE_REGISTRY_SERVER: $(AZURE_REGISTRY_SERVER)
      SUPABASE_URL: $(SUPABASE_URL)
      SUPABASE_SERVICE_KEY: $(SUPABASE_SERVICE_KEY)
      SUPABASE_ARTIFACTS_BASE_URL: $(SUPABASE_ARTIFACTS_BASE_URL)
      SUPABASE_FILES_BASE_URL: $(SUPABASE_FILES_BASE_URL)
      OPENAI_API_KEY: $(OPENAI_API_KEY)
      GOOGLE_API_KEY: $(GOOGLE_API_KEY)
      LLAMA_CLOUD_API_KEY: $(LLAMA_CLOUD_API_KEY)
      MISTRAL_API_KEY: $(MISTRAL_API_KEY)
      QDRANT_URL: $(QDRANT_URL)
      QDRANT_API_KEY: $(QDRANT_API_KEY)
      COHERE_API_KEY: $(COHERE_API_KEY)
      API_KEY: $(API_KEY)
      API_BASE_URL: $(API_BASE_URL)
      API_EVENTS_PATH: $(API_EVENTS_PATH)
      API_PROPOSALS_PATH: $(API_PROPOSALS_PATH)
      API_TENDERS_PATH: $(API_TENDERS_PATH)
      API_ANALYSES_PATH: $(API_ANALYSES_PATH)
      API_ORIGINAL_FILES_PATH: $(API_ORIGINAL_FILES_PATH)
      API_PROCESSED_FILES_PATH: $(API_PROCESSED_FILES_PATH)
      API_JOBS_CALLBACK: $(API_JOBS_CALLBACK)
      API_REQUIREMENTS_PATH: $(API_REQUIREMENTS_PATH)
      API_COMPLIANCE_RESULTS_PATH: $(API_COMPLIANCE_RESULTS_PATH)
      API_TENDER_CLASSIFICATIONS_PATH: $(API_TENDER_CLASSIFICATIONS_PATH)
      API_ANALYSIS_REQUIREMENTS_PATH: $(API_ANALYSIS_REQUIREMENTS_PATH)
      API_COMPLIANCE_MATRIX_PATH: $(API_COMPLIANCE_MATRIX_PATH)
