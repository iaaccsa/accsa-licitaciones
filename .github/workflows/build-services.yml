name: build services

on:
  push:
    branches: [main]
    paths:
      - "accsa-licitaciones-services/**"
      - ".github/workflows/build-services.yml"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild all 16 services"
        type: boolean
        default: false

concurrency:
  group: build-services
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: [self-hosted, vm2]
    timeout-minutes: 5
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Resolve which services changed
        env:
          # Previous SHA of the push. Passed through env rather than
          # interpolated into the script: no github.event.* inside a run block.
          BEFORE_SHA: ${{ github.event.before }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          set -euo pipefail
          ALL=$(find accsa-licitaciones-services -maxdepth 1 -name 'service-*' -type d -printf '%f\n' | sort)

          if [ "$REBUILD_ALL" = "true" ]; then
            LIST="$ALL"
            echo "Full rebuild requested manually."
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            LIST="$ALL"
            echo "No usable base commit: building everything."
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            if printf '%s\n' "$CHANGED" | grep -qx '.github/workflows/build-services.yml'; then
              # The build definition itself changed, so every image is stale.
              LIST="$ALL"
              echo "Workflow changed: rebuilding everything."
            elif printf '%s\n' "$CHANGED" | grep -qE '^accsa-licitaciones-services/(global/|VERSION$)'; then
              # global/ and VERSION are copied into every image.
              LIST="$ALL"
              echo "global/ or VERSION changed: rebuilding everything."
            else
              # git diff prints repository-root-relative paths even when run
              # from a subdirectory, hence the full prefix in the pattern.
              LIST=$(printf '%s\n' "$CHANGED" \
                | grep -oE '^accsa-licitaciones-services/service-[^/]+' \
                | sed 's|^accsa-licitaciones-services/||' | sort -u || true)
            fi
          fi

          echo "Services to build:"
          printf '  %s\n' ${LIST:-"(none)"}
          JSON=$(printf '%s\n' $LIST | jq -R . | jq -sc 'map(select(length > 0))')
          echo "services=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: [self-hosted, vm2]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # A single runner handles one job at a time, so the matrix runs serially
      # regardless. The cap is explicit for the day a second runner is added.
      max-parallel: 2
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          IMAGE="vm2:5000/$SERVICE"
          # Build context is the project root, not the service folder: every
          # Dockerfile copies VERSION and global/ besides its own directory.
          docker build \
            -f "accsa-licitaciones-services/$SERVICE/Dockerfile" \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            accsa-licitaciones-services
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "- \`$SERVICE\` -> \`${GITHUB_SHA::7}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune dangling layers
        if: always()
        run: docker image prune -f > /dev/null
