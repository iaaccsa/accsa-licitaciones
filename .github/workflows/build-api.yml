name: build api

on:
  push:
    branches: [main]
    paths:
      - "accsa-licitaciones-api/**"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

concurrency:
  group: build-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, vm2]
    timeout-minutes: 30
    env:
      IMAGE: vm2:5000/licitaciones-api
    steps:
      - uses: actions/checkout@v5

      - name: Build and push
        working-directory: accsa-licitaciones-api
        run: |
          set -euo pipefail
          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Summary
        if: always()
        run: |
          {
            echo "### API"
            echo ""
            echo "- Image: \`$IMAGE:${GITHUB_SHA::7}\` and \`:latest\`"
            echo "- Declared version: \`$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' accsa-licitaciones-api/app/core/config.py | head -1 | tr -d '\"')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune dangling layers
        if: always()
        run: docker image prune -f > /dev/null
