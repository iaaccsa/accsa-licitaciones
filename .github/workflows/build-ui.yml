name: build ui

on:
  push:
    branches: [main]
    paths:
      - "accsa-licitaciones-ui/**"
      - ".github/workflows/build-ui.yml"
  workflow_dispatch:

concurrency:
  group: build-ui
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, vm2]
    timeout-minutes: 45
    env:
      IMAGE: vm2:5000/licitaciones-ui
      # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
      # They live on the VM, not in GitHub, same as the registry credentials.
      BUILD_ENV: /opt/deploy/ui-build.env
    steps:
      - uses: actions/checkout@v5

      - name: Check the build configuration
        run: |
          set -euo pipefail
          if [ ! -f "$BUILD_ENV" ]; then
            echo "Missing $BUILD_ENV on the runner." >&2
            echo "It must define the NEXT_PUBLIC_* values for the target environment." >&2
            exit 1
          fi
          echo "Variables defined: $(grep -c '^NEXT_PUBLIC' "$BUILD_ENV")"

      - name: Build and push
        working-directory: accsa-licitaciones-ui
        run: |
          set -euo pipefail
          ARGS=()
          while IFS='=' read -r key value; do
            case "$key" in NEXT_PUBLIC_*) ARGS+=(--build-arg "$key=$value") ;; esac
          done < <(grep -E '^NEXT_PUBLIC_' "$BUILD_ENV")

          docker build "${ARGS[@]}" \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Summary
        if: always()
        run: |
          {
            echo "### UI"
            echo ""
            echo "- Image: \`$IMAGE:${GITHUB_SHA::7}\` and \`:latest\`"
            echo "- Declared version: \`$(grep -m1 '"version"' accsa-licitaciones-ui/package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune dangling layers
        if: always()
        run: docker image prune -f > /dev/null
